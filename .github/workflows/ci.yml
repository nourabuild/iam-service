name: CI

on:
  # CI is staged for later. Uncomment these triggers when automatic checks
  # should run on repository activity.
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    env:
      # Test-only signing keys (>= 32 bytes each); never used outside CI.
      JWT_ACCESS_TOKEN_SECRET: ci-only-access-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Format
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          test -z "${unformatted}" || {
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          }

      - name: Verify dependency checksums
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Unit tests
        run: >-
          go test -race
          ./cmd/...
          ./internal/app/...
          ./internal/sdk/config/...
          ./internal/sdk/errs/...
          ./internal/sdk/middleware/...
          ./internal/sdk/models/...
          ./internal/sdk/observability/...
          ./internal/services/...

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  db-tests:
    name: Database tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: sqldb tests against real Postgres
        run: go test -race ./internal/sdk/sqldb/...
